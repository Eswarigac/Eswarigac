<svg width="700" height="380" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bar Gradients -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d20" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <style>
      text { font-family: Segoe UI, -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="700" height="380" fill="#0b0813" rx="16" stroke="#4a3080" stroke-width="1.5" />

  <text x="30" y="45" font-size="20" font-weight="700" fill="#ffffff">Verified Technical Core Stack</text>

  <!-- HTML & CSS / Web Essentials -->
  <text x="30" y="85" font-size="14" font-weight="600" fill="#e2e8f0">HTML, CSS &amp; JavaScript (Web, Ecommerce, Apps)</text>
  <rect x="30" y="95" width="560" height="12" rx="6" fill="#1b1235" />
  <rect x="30" y="95" height="12" rx="6" fill="url(#barGrad1)">
    <animate attributeName="width" from="0" to="532" dur="1.5s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="106" font-size="13" font-weight="bold" fill="#00f2fe">95%</text>

  <!-- React Native / Mobile Apps -->
  <text x="30" y="135" font-size="14" font-weight="600" fill="#e2e8f0">React Native (Mobile Application Development)</text>
  <rect x="30" y="145" width="560" height="12" rx="6" fill="#1b1235" />
  <rect x="30" y="145" height="12" rx="6" fill="url(#barGrad1)">
    <animate attributeName="width" from="0" to="476" dur="1.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="156" font-size="13" font-weight="bold" fill="#00f2fe">85%</text>

  <!-- Laravel & PHP / Backends -->
  <text x="30" y="185" font-size="14" font-weight="600" fill="#e2e8f0">Laravel &amp; PHP (Robust Business Systems &amp; APIs)</text>
  <rect x="30" y="195" width="560" height="12" rx="6" fill="#1b1235" />
  <rect x="30" y="195" height="12" rx="6" fill="url(#barGrad2)">
    <animate attributeName="width" from="0" to="504" dur="1.5s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="206" font-size="13" font-weight="bold" fill="#ff9900">90%</text>

  <!-- MySQL / Database Management -->
  <text x="30" y="235" font-size="14" font-weight="600" fill="#e2e8f0">MySQL (Relational Database Design &amp; Queries)</text>
  <rect x="30" y="245" width="560" height="12" rx="6" fill="#1b1235" />
  <rect x="30" y="245" height="12" rx="6" fill="url(#barGrad3)">
    <animate attributeName="width" from="0" to="448" dur="1.5s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="256" font-size="13" font-weight="bold" fill="#ec4899">80%</text>

  <!-- Hosting & CI/CD / Vercel -->
  <text x="30" y="285" font-size="14" font-weight="600" fill="#e2e8f0">Vercel &amp; Cloud Deployment (Hosting &amp; Git Integration)</text>
  <rect x="30" y="295" width="560" height="12" rx="6" fill="#1b1235" />
  <rect x="30" y="295" height="12" rx="6" fill="url(#barGrad4)">
    <animate attributeName="width" from="0" to="476" dur="1.5s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="306" font-size="13" font-weight="bold" fill="#10b981">85%</text>

  <!-- Experience note -->
  <text x="30" y="348" font-size="12" font-style="italic" fill="#94a3b8">📊 Handcrafted interactive projects built using state of the art design paradigms</text>
</svg>
