<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <style>
      text { font-family: Segoe UI, Verdana, sans-serif; }
    </style>
  </defs>

  <rect width="700" height="360" fill="#0f0c29" rx="16" />

  <text x="30" y="45" font-size="20" font-weight="700" fill="#ffffff">Tech I work with</text>

  <!-- HTML/CSS -->
  <text x="30" y="85" font-size="15" fill="#e5e7eb">HTML &amp; CSS</text>
  <rect x="30" y="95" width="560" height="12" rx="6" fill="#1f2340" />
  <rect x="30" y="95" height="12" rx="6" fill="url(#barGrad1)">
    <animate attributeName="width" from="0" to="540" dur="1.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="105" font-size="13" fill="#9ca3af">98%</text>

  <!-- JavaScript -->
  <text x="30" y="135" font-size="15" fill="#e5e7eb">JavaScript</text>
  <rect x="30" y="145" width="560" height="12" rx="6" fill="#1f2340" />
  <rect x="30" y="145" height="12" rx="6" fill="url(#barGrad1)">
    <animate attributeName="width" from="0" to="520" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="155" font-size="13" fill="#9ca3af">95%</text>

  <!-- React -->
  <text x="30" y="185" font-size="15" fill="#e5e7eb">React</text>
  <rect x="30" y="195" width="560" height="12" rx="6" fill="#1f2340" />
  <rect x="30" y="195" height="12" rx="6" fill="url(#barGrad1)">
    <animate attributeName="width" from="0" to="470" dur="1.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="205" font-size="13" fill="#9ca3af">85%</text>

  <!-- Laravel -->
  <text x="30" y="235" font-size="15" fill="#e5e7eb">Laravel</text>
  <rect x="30" y="245" width="560" height="12" rx="6" fill="#1f2340" />
  <rect x="30" y="245" height="12" rx="6" fill="url(#barGrad2)">
    <animate attributeName="width" from="0" to="450" dur="1.6s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="255" font-size="13" fill="#9ca3af">80%</text>

  <!-- PHP -->
  <text x="30" y="285" font-size="15" fill="#e5e7eb">PHP</text>
  <rect x="30" y="295" width="560" height="12" rx="6" fill="#1f2340" />
  <rect x="30" y="295" height="12" rx="6" fill="url(#barGrad2)">
    <animate attributeName="width" from="0" to="450" dur="1.6s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="305" font-size="13" fill="#9ca3af">80%</text>

  <!-- MySQL -->
  <text x="30" y="335" font-size="15" fill="#e5e7eb">MySQL</text>
  <rect x="30" y="345" width="560" height="12" rx="6" fill="#1f2340" />
  <rect x="30" y="345" height="12" rx="6" fill="url(#barGrad3)">
    <animate attributeName="width" from="0" to="395" dur="1.6s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
  </rect>
  <text x="600" y="355" font-size="13" fill="#9ca3af">70%</text>
</svg>
